# Run from the project root. This is an H100 training candidate, not a validated
# GPU run. --validate-only never constructs model weights or starts Ray.
cluster:
  num_nodes: 1
  component_placement:
    actor: 0
runner:
  task_type: sft
  logger:
    log_path: outputs/wall-rlt
    project_name: wall-rlt
    experiment_name: ar5_joint8_stage1
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 100
  val_check_interval: 50
  save_interval: 50
  resume_dir: null
data:
  train_data_paths: configs/rlt/top_error_ar5_joint_next_v1.json
  val_data_paths: configs/rlt/top_error_ar5_joint_next_v1.json
  num_workers: 0
  # Short-training smoke evaluation; set null for all dev windows.
  eval_max_samples: 64
  image_size: 448
  max_length: 2048
  complete_windows_only: false
actor:
  group_name: WallRLTActor
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 4
  eval_batch_size: 1
  seed: 0
  enable_offload: false
  model:
    model_type: wall_rlt
    model_path: models/wall-oss-0.5
    precision: fp32
    is_lora: false
    load_to_device: false
    initialization: new_transfer
    initialization_seed: 0
    processor_path: models/wall-oss-0.5
    wall_attention: sdpa
    vision_attention: flash_attention_2
    rlt:
      checkpoint_path: models/wall-oss-0.5
      wall_train_config: models/wall-oss-0.5/config.yml
      data_contract_path: configs/rlt/top_error_ar5_joint_next_v1.json
      input_dim: 2048
      embed_dim: 2048
      prefix_seq_len: 1024
      num_layers: 2
      num_heads: 8
      mlp_ratio: 4.0
      dropout_rate: 0.0
      rlt_alpha: 1.0
      action_horizon: 32
      model_action_dim: 26
      action_token_id: 151666
  optim:
    lr: 2.5e-5
    value_lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 100
    lr_warmup_steps: 10
    lr_scheduler: constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: true
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    wrap_policy:
      transformer_layer_cls_to_wrap: [Qwen2_5_VLDecoderLayer_with_MoE, Qwen2_5_VLVisionBlock]
    wrappers:
      rlt_features:
        module_names: [rlt_module]
        wrap_mode: subtree
    mixed_precision_rules:
      rlt_features: fp32
    mixed_precision_policies:
      fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
